<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title><base href="{{BASE}}">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src https://github.com https://release-assets.githubusercontent.com https://objects.githubusercontent.com; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="theme-color" content="#e8efdf"><link rel="icon" type="image/png" sizes="32x32" href="icons/reading-32-edb388ce.png"><link rel="apple-touch-icon" sizes="180x180" href="icons/reading-180-edb388ce.png"><link rel="stylesheet" href="style.css?v={{ASSET_VERSION}}"><link rel="stylesheet" href="storybook.css?v={{ASSET_VERSION}}"><script type="module" src="app.js?v={{ASSET_VERSION}}"></script></head>
<body><a class="skip-link" href="#view">跳至主要內容</a><div class="app-shell"><aside class="sidebar"><a class="brand" href="#home"><span class="brand-icon" aria-hidden="true"><img src="icons/reading-128-edb388ce.png" alt="" width="128" height="128"></span><span>日讀<small>DAILY READING</small></span></a><div class="nav-caption">把日子，讀成風景</div><nav aria-label="主選單"><a href="#home"><span class="nav-icon" aria-hidden="true">⌂</span>今日書房</a><div class="nav-caption">我的書架</div><a href="#library/unread"><span class="nav-icon" aria-hidden="true">○</span>未讀<span class="nav-count" data-shelf-count="unread">0</span></a><a href="#library/reading"><span class="nav-icon" aria-hidden="true">◒</span>正在讀<span class="nav-count" data-shelf-count="reading">0</span></a><a href="#library/completed"><span class="nav-icon" aria-hidden="true">✓</span>已讀完<span class="nav-count" data-shelf-count="completed">0</span></a><div class="nav-caption">閱讀小幫手</div><a href="#guide"><span class="nav-icon" aria-hidden="true">?</span>使用指南</a></nav><div class="sidebar-bottom"><img class="sidebar-landscape" src="illustrations/mountains.svg" alt="" width="1200" height="460"><div class="privacy-card"><strong>慢慢讀，也是一種前進。</strong><p>閱讀與收聽進度<br>只保存在目前瀏覽器。</p></div><button id="export-progress">匯出本機進度 ↗</button></div></aside>
<div class="main-wrap"><header class="topbar"><span><i aria-hidden="true"></i> 留一段安靜，給今天的自己。</span><div class="appearance-tools"><button id="theme-toggle" aria-label="切換夜晚模式" aria-pressed="false">☾ 夜晚</button><details id="appearance-settings"><summary>字體與外觀 <span aria-hidden="true">⚙</span></summary><div class="appearance-panel"><div class="settings-heading"><strong>把書房調成喜歡的樣子</strong><p>舒服一點，讀久一點。</p></div><fieldset><legend>頁面模式</legend><div class="preference-options"><button data-preference="theme" data-value="light" aria-label="白天模式">☀ 白天</button><button data-preference="theme" data-value="dark" aria-label="夜晚模式">☾ 夜晚</button><button data-preference="theme" data-value="auto" aria-label="跟隨系統">跟隨系統</button></div></fieldset><fieldset><legend>字體</legend><div class="preference-options"><button data-preference="font" data-value="sans" aria-label="清晰黑體">清晰黑體</button><button data-preference="font" data-value="book" aria-label="書卷宋體">書卷宋體</button></div></fieldset><fieldset><legend>正文字級</legend><div class="preference-options"><button data-preference="size" data-value="normal" aria-label="標準字級">標準</button><button data-preference="size" data-value="large" aria-label="大字級">大</button><button data-preference="size" data-value="largest" aria-label="特大字級">特大</button></div></fieldset><div class="motion-preference"><div><strong>森林的呼吸</strong><span>流雲、波光與微光粒子</span></div><button id="motion-toggle" aria-label="動態效果" aria-pressed="true">動態開啟</button></div><p id="appearance-status" role="status"></p></div></details></div></header><main class="main-content"><div id="view" tabindex="-1" aria-live="polite"><h1>載入書庫…</h1></div><section id="reading" aria-label="章節正文" hidden><div class="reader-toolbar"><button id="close-reader">收起原文</button><a id="markdown-download" download>下載 Markdown ↧</a></div><div id="reader-content"></div></section></main><footer class="site-footer"><span>日讀 · 把日子，讀成風景</span><a href="#guide">使用指南 ↗</a></footer></div></div>
<div id="texts" hidden>{{CHAPTERS}}</div>
<footer class="player" aria-label="音訊播放器"><div class="now"><strong id="now-title">選擇章節</strong><span id="status" role="status">準備載入</span><button id="retry-load" hidden>重新連線</button></div><div class="controls"><button id="previous" aria-label="上一章">上一章</button><button id="rewind" aria-label="倒退十五秒">−15秒</button><button id="play" aria-label="播放">播放</button><button id="restart" aria-label="從頭播放本章">從頭播放</button><button id="forward" aria-label="前進十五秒">+15秒</button><button id="next" aria-label="下一章">下一章</button><div id="rate" role="group" aria-label="播放速度"><button data-rate="0.75" aria-label="0.75 倍">0.75×</button><button data-rate="1" aria-label="1 倍" aria-pressed="true">1×</button><button data-rate="1.25" aria-label="1.25 倍">1.25×</button><button data-rate="1.5" aria-label="1.5 倍">1.5×</button><button data-rate="2" aria-label="2 倍">2×</button></div></div><div class="timeline"><output id="current">0:00</output><input id="seek" type="range" aria-label="播放進度" min="0" max="0" value="0" step="0.1"><output id="duration">0:00</output></div><audio id="audio" preload="metadata"></audio></footer>
</body></html>
