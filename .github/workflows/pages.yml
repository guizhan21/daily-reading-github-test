name: Test and deploy Pages
on:
  push:
    branches: [main, 'migration/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref == 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm test
      - run: node scripts/probe.mjs
      - run: npm run build
      - run: npm run build:root
      - run: node scripts/acceptance.mjs --root
      - run: npm run acceptance
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-artifact@v4
        with:
          name: migration-build-and-http
          path: |
            dist
            test-results/http.json
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  browser:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, webkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Use the runner's real Chrome, installing only if absent
        if: matrix.browser == 'chrome'
        run: |
          if ! command -v google-chrome || ! command -v xvfb-run; then
            npx playwright install --with-deps chrome
          fi
          google-chrome --version
          command -v xvfb-run
      - name: Install Firefox and its dependencies
        if: matrix.browser == 'firefox'
        run: npx playwright install --with-deps firefox
      - name: Provide a real audio output service for headless Firefox
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/audio-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
          pactl list short sinks
      - run: npm run build
      - name: Test isolated migration before deployment
        if: matrix.browser != 'webkit'
        run: node tests/run-local.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Test WebKit with the official matching preinstalled dependencies
        if: matrix.browser == 'webkit'
        run: |
          docker run --rm --init -v "$PWD:/work" -w /work -e BROWSER=webkit \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea \
            node tests/run-local.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predeploy-${{ matrix.browser }}
          path: test-results
          retention-days: 14
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, browser]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy only after all migration checks pass
        id: deployment
        uses: actions/deploy-pages@v4
  external:
    needs: deploy
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, webkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Use the runner's real Chrome, installing only if absent
        if: matrix.browser == 'chrome'
        run: |
          if ! command -v google-chrome || ! command -v xvfb-run; then
            npx playwright install --with-deps chrome
          fi
          google-chrome --version
          command -v xvfb-run
      - name: Install Firefox and its dependencies
        if: matrix.browser == 'firefox'
        run: npx playwright install --with-deps firefox
      - name: Provide a real audio output service for headless Firefox
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/audio-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
          pactl list short sinks
      - name: Verify actual public website and Release playback
        if: matrix.browser != 'webkit'
        run: npm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}
          SITE_URL: https://guizhan21.github.io/daily-reading-github-test/
      - name: Verify real background-tab playback with a headed browser
        if: matrix.browser == 'chrome'
        run: xvfb-run -a node tests/background.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          SITE_URL: https://guizhan21.github.io/daily-reading-github-test/
      - name: Verify actual Pages and Release playback with official WebKit
        if: matrix.browser == 'webkit'
        run: |
          docker run --rm --init -v "$PWD:/work" -w /work -e BROWSER=webkit \
            -e SITE_URL=https://guizhan21.github.io/daily-reading-github-test/ \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea \
            node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-playback-${{ matrix.browser }}
          path: test-results
          retention-days: 14
