name: Test and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm test
      - run: node scripts/probe.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  browser:
    needs: deploy
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Test actual public Pages and Release audio
        run: npm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}
          SITE_URL: https://guizhan21.github.io/daily-reading-github-test/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playback-${{ matrix.browser }}
          path: test-results
          retention-days: 14
